name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Lint backend (ruff)
        run: ruff check backend/app backend/tests

      - name: Run backend tests (real saved model artifact)
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend — lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: TypeScript check & build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          additional-contexts: |
            models=./models
          push: false
          tags: airbnb-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: airbnb-frontend:ci

  publish:
    name: CD — publish images to GHCR
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend — build & push (SHA-tagged)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          additional-contexts: |
            models=./models
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/airbnb-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/airbnb-backend:latest

      - name: Frontend — build & push (SHA-tagged)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/airbnb-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/airbnb-frontend:latest

      - name: Summary
        run: |
          echo "### Published images" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/airbnb-backend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/airbnb-frontend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # NOTE: Continuous *Deployment* to a cloud host is intentionally NOT configured.
  # It will be added after the hosting provider is selected and approved.
