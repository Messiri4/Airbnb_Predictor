
# Render Blueprint — Airbnb Pricing Intelligence DSS
# Free tier only: no paid instances, databases, or persistent disks.

services:
  # FastAPI backend serving the saved tuned Log-XGBoost pipeline.
  - type: web
    name: airbnb-pricing-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: /app/models/best_price_model.pkl
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        sync: false

  # React + Vite static site
  - type: web
    name: airbnb-pricing-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
