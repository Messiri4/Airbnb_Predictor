server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the FastAPI backend service.
    # Use a resolver + variable so Nginx doesn't fail at startup when the
    # backend container's DNS entry isn't ready yet (compose startup race).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_health http://backend:8000/health;
        proxy_pass $backend_health;
    }
}
